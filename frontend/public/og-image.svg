<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="250" fill="#16a34a" opacity="0.08"/>
  <circle cx="150" cy="530" r="200" fill="#22c55e" opacity="0.06"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="6" height="270" rx="3" fill="url(#glow)"/>

  <!-- Wheat emoji / icon area -->
  <text x="100" y="145" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif" font-size="60">🌾</text>

  <!-- Brand name -->
  <text x="175" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    Agro<tspan fill="#4ade80">tech</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#86efac" font-weight="400">
    Nigeria's Premier Agricultural Technology Store
  </text>

  <!-- Main headline -->
  <text x="100" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
    Grow More.
  </text>
  <text x="100" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#4ade80">
    Harvest More.
  </text>

  <!-- Sub text -->
  <text x="100" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#bbf7d0">
    Fertilizers · Pesticides · Tools · Irrigation · Seeds
  </text>

  <!-- Stats row -->
  <rect x="100" y="470" width="1000" height="1" fill="#166534"/>

  <text x="100" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#86efac">
    2,500+ Products
  </text>
  <text x="340" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#86efac">
    15,000+ Happy Farmers
  </text>
  <text x="640" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#86efac">
    All 36 States Covered
  </text>
  <text x="920" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#86efac">
    ⭐ 4.9/5 Rating
  </text>

  <!-- URL -->
  <text x="100" y="580" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#4ade80">
    agrotech-store.vercel.app
  </text>

  <!-- WhatsApp badge -->
  <rect x="900" y="540" width="220" height="50" rx="25" fill="#22c55e"/>
  <text x="970" y="571" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#052e16">
    Order on WhatsApp
  </text>
</svg>
