<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../other css/signup.css">
</head>
  <style>
    *{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    list-style-type: none;
    text-decoration: none;
}
body{
  font-family: Arial, sans-serif;
  background: #f6fff7;
  margin: 0;
  padding: 0;
}
nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding:20px 80px;
    background-color: rgb(1, 71, 22);
}
#nav-ul ul{
   display: flex;
}
#nav-ul ul li{
    padding: 20px;
}
#nav-ul ul li a{
    color:white;
    font-size: 1.2em;
    font-weight:400 ;
}
.logo{
    width: 200px;
    color: white;
    font-size: 2em;
    font-weight: 900;
}
.signup-container {
  background: #fff;
  padding: 2rem;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 400px;
  margin:100px auto;
}
.signup-form h2 {
  margin-bottom: 1.5rem;
  text-align: center;
  color: #333;
}

.signup-form label {
  display: block;
  margin-top: 1rem;
  margin-bottom: 0.3rem;
  color: #555;
}
.signup-form input[type="text"],
.signup-form input[type="email"],
.signup-form input[type="password"] {
  width: 100%;
  padding: 0.8rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  border-color: #28a745;
}


.checkbox-container {
  margin-top: 1rem;
  display: flex;
  align-items: center;
}

.checkbox-container input {
  margin-right: 0.5rem;
}


.checkbox-container a {
  color: #007bff;
  text-decoration: none;
}
.checkbox-container a:hover {
  text-decoration: underline;
}
.signup-form button {
  margin-top: 1.5rem;
  width: 100%;
  padding: 0.8rem;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;

}

.signup-form button:hover {
  background: #218838;
}




  </style>

<body>
  <header>
           <nav>
                <div id="header">
                  <a href="" class="logo">AgroFresh</a>
               </div>
               <!-- <div>
                 <form class="search-form" role="search">
                     <input class="search-input" type="search" placeholder="Search" aria-label="Search"/>
                     <button class="search-btn"  type="submit">Search</button>
                 </form>
               </div> -->
             <div id="nav-ul">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./product.html">Product</a></li>
                    <li id="lg-bag"><a href="./cart.html"><i class="fa-solid fa-cart-plus"></i></i></a></li>
                    <!-- <a href="#" id="close"><i class="far fa-times"></i></a> -->
                </ul>
             </div>
           </nav>
        </header>

<div class="signup-container">
    <form class="signup-form" action="#" method="post">
      <h2>Create Account</h2>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required />

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat password" required />

      <div class="checkbox-container">
        <input type="checkbox" id="tos" name="tos" required />
        <label for="tos">I agree to the <a href="#">Terms & Privacy</a></label>
      </div>

      <button type="submit">Sign Up</button>
    </form>
</body>
<script src="script.js"></script>
</html>
